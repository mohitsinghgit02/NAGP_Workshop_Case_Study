version: "3.8"

services:
  auth:
    build: 
      context: ./app/auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8000"     # REST
      - "50051:50051"   # gRPC
    volumes:
      - ./app/auth/data:/app/data
    env_file:
      - .env
    networks:
      - app-net
  
  # auth-grpc:
  #   build: 
  #     context: ./app/auth
  #     dockerfile: Dockerfile.grpc
  #   container_name: auth-grpc-service
  #   ports:
  #     - "50051:50051"
  #   volumes:
  #     - ./app/auth/data:/app/data
  #   env_file:
  #     - .env
  #   networks:
  #     - app-net

  customer:
    build: 
      context: ./app/customer
      dockerfile: Dockerfile.api
    container_name: customer-service
    ports:
      - "8002:8000"
    volumes:
      - ./app/customer/data:/app/data
    env_file:
      - .env
    networks:
      - app-net
    depends_on:
      - auth
  
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - customer
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
  
