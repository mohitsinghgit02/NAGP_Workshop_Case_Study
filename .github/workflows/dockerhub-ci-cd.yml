name: Build & Deploy

on:
  push:
    branches:
      - "**"
      # - release/*

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
# ---------------- BUILD ----------------
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Generate unique image tag
      - name: Generate image tag
        id: vars
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          TS=$(date +%Y%m%d%H%M%S)
          TAG="${BRANCH}-${TS}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Configure AWS credentials for ECR
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build & push Auth image
      - name: Build & Push Auth image
        run: |
          docker build -t amcart-auth:${{ steps.vars.outputs.tag }} ./app/auth
          docker tag amcart-auth:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-auth:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-auth:${{ steps.vars.outputs.tag }}

      # Build & push Customer image
      - name: Build & Push Customer image
        run: |
          docker build -f ./app/customer/Dockerfile.api -t amcart-customer:${{ steps.vars.outputs.tag }} ./app/customer
          docker tag amcart-customer:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-customer:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-customer:${{ steps.vars.outputs.tag }}

      # Build & push Product image
      - name: Build & Push Product image
        run: |
          docker build -f ./app/products/Dockerfile.api -t amcart-product:${{ steps.vars.outputs.tag }} ./app/products
          docker tag amcart-product:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-product:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-product:${{ steps.vars.outputs.tag }}

      # Build & push Nginx image
      - name: Build & Push Nginx image
        run: |
          docker build -t amcart-nginx:${{ steps.vars.outputs.tag }} ./app/nginx
          docker tag amcart-nginx:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-nginx:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-nginx:${{ steps.vars.outputs.tag }}

# ---------------- DEPLOY ----------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()  # or restrict to main/release branches if you want

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECS via CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name amcart-stack \
            --template-file infra/ecs-alb-efs.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              VpcId=vpc-08246303796632b32 \
              Subnets=subnet-020bfcd4a44eceee5,subnet-0b94369f337bc1841 \
              ImageTag=${{ needs.build.outputs.image_tag }} \
              AWSAccountId=${{ env.AWS_ACCOUNT_ID }} \
              AWSRegion=${{ env.AWS_REGION }}
              
      - name: Get ALB DNS from CloudFormation
        id: alb
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name amcart-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)

          echo "ALB_DNS=$ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
      
      - name: Deploy Frontend Infra (S3 + CloudFront)
        run: |
          aws cloudformation deploy \
            --stack-name amcart-frontend \
            --template-file infra/frontend-s3-cloudfront.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ProjectName=amcart \
              ALBDomainName=${{ steps.alb.outputs.alb_dns }}

      - name: Get Frontend Infra Outputs
        id: frontend
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name amcart-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name amcart-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: front
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync front/dist s3://${{ steps.frontend.outputs.bucket }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.frontend.outputs.dist_id }} \
            --paths "/*"
