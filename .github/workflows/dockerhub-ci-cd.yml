name: Build & Deploy

on:
  push:
    branches:
      # - "**"
      - release/*

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
# ---------------- BUILD ----------------
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Generate unique image tag
      - name: Generate image tag
        id: vars
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          TS=$(date +%Y%m%d%H%M%S)
          TAG="${BRANCH}-${TS}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Configure AWS credentials for ECR
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build & push Auth image
      - name: Build & Push Auth image
        run: |
          docker build -t amcart-auth:${{ steps.vars.outputs.tag }} ./app/auth
          docker tag amcart-auth:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-auth:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-auth:${{ steps.vars.outputs.tag }}

      # Build & push Customer image
      - name: Build & Push Customer image
        run: |
          docker build -f ./app/customer/Dockerfile.api -t amcart-customer:${{ steps.vars.outputs.tag }} ./app/customer
          docker tag amcart-customer:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-customer:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-customer:${{ steps.vars.outputs.tag }}

      # Build & push Nginx image
      - name: Build & Push Nginx image
        run: |
          docker build -t amcart-nginx:${{ steps.vars.outputs.tag }} ./app/nginx
          docker tag amcart-nginx:${{ steps.vars.outputs.tag }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-nginx:${{ steps.vars.outputs.tag }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/amcart-nginx:${{ steps.vars.outputs.tag }}

# ---------------- DEPLOY ----------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()  # or restrict to main/release branches if you want

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECS via CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name amcart-stack \
            --template-file infra/ecs-alb-efs.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              VpcId=vpc-07cf0bd2defe827ee \
              Subnets=subnet-002e4892bb31ff833,subnet-019e055615dc1a073 \
              ImageTag=${{ needs.build.outputs.image_tag }} \
              AWSAccountId=${{ env.AWS_ACCOUNT_ID }} \
              AWSRegion=${{ env.AWS_REGION }}
              
      - name: Get ALB DNS from CloudFormation
        id: alb
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name amcart-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDNS'].OutputValue" \
            --output text)

          echo "ALB_DNS=$ALB_DNS"
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
