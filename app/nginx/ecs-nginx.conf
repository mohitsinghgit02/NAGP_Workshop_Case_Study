events {}

http {

    # ========================
    # UPSTREAM SERVICES
    # ========================
    upstream auth_upstream {
        server 127.0.0.1:8001;
    }

    upstream customer_upstream {
        server 127.0.0.1:8000;
    }

    # ========================
    # DYNAMIC CLOUD FRONT CORS
    # ========================
    map $http_origin $cors_origin {
        default "";
        ~^https://[a-zA-Z0-9-]+\.cloudfront\.net$ $http_origin;
    }

    server {
        listen 80;

        # ========================
        # GLOBAL CORS HEADERS
        # ========================
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Id-Token" always;

        # ========================
        # PREFLIGHT (OPTIONS)
        # ========================
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ========================
        # AUTH SERVICE
        # ========================
        location /auth/ {
            proxy_pass http://auth_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================
        # CUSTOMER SERVICE
        # ========================
        location /customer/ {
            proxy_pass http://customer_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================
        # HEALTH CHECK
        # ========================
        location /health {
            return 200 "ok";
        }
    }
}