events {}

http {
    upstream auth_upstream {
        server auth:8001;
    }

    upstream customer_upstream {
        server customer:8000;
    }

    upstream product_upstream {
        server product:8003;
    }

    server {
        listen 80;

        # ========================
        # GLOBAL CORS HEADERS
        # ========================
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Id-Token" always;

        # ========================
        # PREFLIGHT REQUESTS
        # ========================
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ========================
        # AUTH SERVICE
        # ========================
        location /auth/ {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ========================
        # CUSTOMER SERVICE
        # ========================
        location /customer/ {
            proxy_pass http://customer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ========================
        # PRODUCT SERVICE
        # ========================
        location /product/ {
            proxy_pass http://product_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ========================
        # HEALTH CHECK
        # ========================
        location /health {
            return 200 "ok";
        }
    }
}
